# Runs OUTSIDE the platform (a $6 droplet in another region, or any always-on
# machine). Everything is pinned by tag; add digests after the first pull
# (ops/deploy/pinning.md).
#
#   cp .env.example .env   # fill LIVEKIT_* and one alert channel
#   docker compose up -d
#   open http://<host>:3001 (Uptime Kuma)  http://<host>:3000 (Grafana)
services:
  listener:
    build: .
    image: hgradio/synthetic-listener:0.1.0
    restart: unless-stopped
    env_file: .env
    volumes:
      - listener-data:/data
    ports:
      - "9101:9101"

  reconciler:
    image: hgradio/synthetic-listener:0.1.0
    restart: unless-stopped
    env_file: .env
    command: ["node", "src/reconcile.mjs"]
    volumes:
      - listener-data:/data
    depends_on: [listener]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=60d"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    volumes:
      - kuma-data:/app/data
    ports:
      - "3001:3001"

volumes:
  listener-data:
  prom-data:
  grafana-data:
  kuma-data:
